<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 – HTML Tables – Derrick Asimwe</title>
    <meta name="description" content="Account feature comparison table built with thead, tbody, caption, and zebra striping.">
    <meta name="author" content="Derrick Asimwe">
    <link rel="stylesheet" href="styles/tables.css">
</head>
<body>
    <main>
        <h1>Acme Wildwest Accounts</h1>
        <div class="table-wrap">
            <table>
                <caption>Table 1: Account Feature Comparison</caption>
                <thead>
                    <tr>
                        <th scope="col">Features</th>
                        <th scope="col">Basic</th>
                        <th scope="col">Premium</th>
                        <th scope="col">Enterprise</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th scope="row">Storage</th>
                        <td>10 GB</td>
                        <td>100 GB</td>
                        <td>Unlimited</td>
                    </tr>
                    <tr>
                        <th scope="row">Users</th>
                        <td>1</td>
                        <td>5</td>
                        <td>Unlimited</td>
                    </tr>
                    <tr>
                        <th scope="row">Email Support</th>
                        <td>✔️</td>
                        <td>✔️</td>
                        <td>✔️</td>
                    </tr>
                    <tr>
                        <th scope="row">Phone Support</th>
                        <td>❌</td>
                        <td>✔️</td>
                        <td>✔️</td>
                    </tr>
                    <tr>
                        <th scope="row">Custom Branding</th>
                        <td>❌</td>
                        <td>❌</td>
                        <td>✔️</td>
                    </tr>
                    <tr>
                        <th scope="row">Dedicated Manager</th>
                        <td>❌</td>
                        <td>❌</td>
                        <td>✔️</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
