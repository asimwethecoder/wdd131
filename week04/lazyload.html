<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 – Lazy Loading Images – Derrick Asimwe</title>
    <meta name="description" content="A page of six stacked portrait images that load lazily as the user scrolls.">
    <meta name="author" content="Derrick Asimwe">
    <link rel="stylesheet" href="styles/lazyload.css">
    <script src="scripts/lazyload.js" defer></script>
</head>
<body>
    <main>
        <h1>Lazy Loading Gallery</h1>
        <img src="images/photo1.jpg" alt="Calm blue sea with driftwood and dark rocks in the foreground and a misty hill in the distance" loading="lazy" width="400" height="600">
        <img src="images/photo2.jpg" alt="Sunlit hillside with trees and part of the Hollywood sign" loading="lazy" width="400" height="600">
        <img src="images/photo3.jpg" alt="Waves washing over a dark beach under a stormy sky at sunset" loading="lazy" width="400" height="600">
        <img src="images/photo4.jpg" alt="Silhouette of a cross against dramatic dark clouds and golden light" loading="lazy" width="400" height="600">
        <img src="images/photo5.jpg" alt="Black and white view of the Eiffel Tower with a bird in flight and crowds below" loading="lazy" width="400" height="600">
        <img src="images/photo6.jpg" alt="Misty green forest hills with fog drifting through the trees" loading="lazy" width="400" height="600">
    </main>
    <footer>
        <p>&copy; <span id="currentyear"></span> Derrick Asimwe</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
